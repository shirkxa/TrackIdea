# Produkcja: SPRING_PROFILES_ACTIVE=prod (z PostgreSQL: prod,postgres)
# Frontend: https://trackidea.rapy.gg, API: https://trackidea-api.rapy.gg
trackidea.cors.allowed-origins=https://trackidea.rapy.gg
trackidea.public-url=https://trackidea.rapy.gg
# XSRF-TOKEN ustawiany przez API musi być czytelny dla JS na subdomenie frontendu
trackidea.cookie-domain=rapy.gg
# Za reverse proxy (TLS terminowany na proxy) – poprawne https:// i ciasteczka Secure
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true

# Logowanie bez hasła (przełącznik kont) jest w produkcji wyłączone.
# Na czas prezentacji można je świadomie włączyć: TRACKIDEA_DEMO_MODE=true.
trackidea.demo-mode=${TRACKIDEA_DEMO_MODE:false}
# Hasło kont zespołu PCI. Gdy puste, przy pierwszym starcie powstaje losowe i jest wypisane w logu.
trackidea.demo-password=${TRACKIDEA_PASSWORD:}

# Trwała baza: plik H2 w katalogu danych (w Dockerze wolumen /data), chyba że włączono profil postgres.
# Praca analityka (poprawki kart, zatwierdzone oceny) przeżywa restart.
spring.datasource.url=jdbc:h2:file:${TRACKIDEA_DATA_DIR:/data}/trackidea
spring.jpa.hibernate.ddl-auto=update

# Analizy AI zapamiętane razem z bazą; dane przykładowe można wyłączyć: TRACKIDEA_DEMO_DATA=false
trackidea.ai.cache-dir=${TRACKIDEA_DATA_DIR:/data}
trackidea.radar.fe.cache-dir=${TRACKIDEA_DATA_DIR:/data}
trackidea.demo-data=${TRACKIDEA_DEMO_DATA:true}
