# Produkcja: SPRING_PROFILES_ACTIVE=prod (z PostgreSQL: prod,postgres)
# Frontend: https://trackidea.rapy.gg, API: https://trackidea-api.rapy.gg
trackidea.cors.allowed-origins=https://trackidea.rapy.gg
trackidea.public-url=https://trackidea.rapy.gg

# XSRF-TOKEN ustawiany przez API musi być czytelny dla JS na subdomenie frontendu
trackidea.cookie-domain=rapy.gg

# Za reverse proxy (TLS terminowany na proxy) – poprawne https:// i ciasteczka Secure
server.forward-headers-strategy=native
