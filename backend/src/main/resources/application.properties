spring.application.name=trackidea
server.port=8080

# Domyślnie baza H2 w pamięci – dane demo ładują się przy każdym starcie.
spring.datasource.url=jdbc:h2:mem:trackidea;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# Asystent AI: włączany automatycznie, gdy ustawiono ANTHROPIC_API_KEY
trackidea.ai.enabled=true
trackidea.ai.model=claude-opus-5-5

trackidea.cors.allowed-origins=http://localhost:5173

# Adres frontendu – używany w linkach w eksporcie CSV
trackidea.public-url=http://localhost:5173

# Domena ciasteczka XSRF-TOKEN (puste = tylko host API). Ustaw np. na rapy.gg, gdy frontend i API są na subdomenach.
trackidea.cookie-domain=

# Dokumentacja API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# Logowanie: sesja w ciasteczku HttpOnly, SameSite=Lax; ochrona CSRF (ciasteczko XSRF-TOKEN)
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Tryb demo: szybkie przełączanie kont na prezentacji. W wersji produkcyjnej ustaw false.
trackidea.demo-mode=true
# Hasło wszystkich kont demo (logowanie e-mailem z danych demo)
trackidea.demo-password=demo123

# Radar: źródła online (OpenAlex, CORDIS) i cykliczna aktualizacja bazy.
# Bez internetu ustaw trackidea.radar.live=false – Radar użyje próbek z resources/radar.
trackidea.radar.live=true
trackidea.radar.initial-delay=PT5S
trackidea.radar.refresh-interval=PT6H
trackidea.radar.openalex.per-query=8
trackidea.radar.cordis.per-query=8
trackidea.radar.fe.per-query=5
